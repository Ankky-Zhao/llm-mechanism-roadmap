<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM Mechanism Roadmap</title>
<meta name="description" content="A bilingual (中文 / English) roadmap for understanding how large language models work: derivations, runnable exercises with tests, why-questions and an interview bank.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" onload="window.__katexCss=1">
<style>
:root{
  --bg:#F6F7F4; --surface:#FFFFFF; --surface-2:#EEF1EC; --ink:#151A1E; --muted:#5B6670; --line:#D6DCD8; --line-soft:#E6EAE6;
  --accent:#1E6B4F; --accent-ink:#175640; --accent-soft:#DDEEE5; --accent-2:#3E5A8C; --accent-2-soft:#E1E8F4;
  --pin:#B4641E; --pin-soft:#F7E8D8; --done:#2E7D4F; --code-bg:#F1F3EF;
  --shadow:0 1px 2px rgba(21,26,30,.05),0 10px 30px -18px rgba(21,26,30,.28);
  --display:"Sora","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --body:"Source Sans 3","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1412; --surface:#171D1A; --surface-2:#1F2622; --ink:#E7ECE8; --muted:#97A39C; --line:#2B3530; --line-soft:#222B26;
  --accent:#5FC199; --accent-ink:#8ED9B8; --accent-soft:#173226; --accent-2:#8FA9DC; --accent-2-soft:#1D2739;
  --pin:#E2A05E; --pin-soft:#33261A; --done:#7BD19E; --code-bg:#121815;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.7);}}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink);text-decoration:none;border-bottom:1px solid transparent}
a:hover{border-bottom-color:currentColor}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 96px}
h1,h2,h3,h4,h5{font-family:var(--display);text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--mono)}
.mono,pre,code,svg .mono{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:4px}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.top .in{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;color:var(--ink);border:0}
.brand i{width:10px;height:10px;border-radius:50%;border:3px solid var(--accent);display:inline-block}
.topnav{display:flex;gap:2px 16px;flex-wrap:wrap;font-size:14px;margin-left:auto}
.topnav a{color:var(--muted);border:0}
.topnav a:hover{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:5px 11px;cursor:pointer;font:inherit;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:760px){.topnav{display:none}.seg{margin-left:auto}}

.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:40px;align-items:end;padding:52px 0 34px;border-bottom:1px solid var(--line)}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:24px;padding-top:34px}}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
h1{font-size:clamp(32px,4.8vw,54px);line-height:1.06;margin:10px 0 16px;font-weight:700}
h1 span{color:var(--accent)}
.lede{font-size:18px;color:var(--muted);max-width:58ch;margin:0 0 22px}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px}
.stat b{font-family:var(--display);font-size:26px;font-weight:600;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
.panel h4{margin:0 0 8px;font-size:14px;font-weight:600}
.num{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.sib{display:grid;gap:6px}
.sib a{display:block;padding:8px 12px;border:1px solid var(--line-soft);border-radius:8px;font-size:14px;color:var(--ink)}
.sib a:hover{border-color:var(--accent)}
.sib a span{display:block;color:var(--muted);font-size:12.5px}

section.sec{padding-top:54px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;margin-bottom:8px}
.sec-h h2{font-size:28px;margin:0;font-weight:600}
.sec-h .k{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.sec-p{color:var(--muted);max-width:74ch;margin:0 0 20px}

/* overview map */
.ov{display:grid;gap:8px}
.ov-row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:700px){.ov-row{grid-template-columns:1fr}}
.ov-row .ln{font-size:14px;font-weight:600;font-family:var(--display)}
.ov-row .ln small{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:400;margin-right:8px}
.nodes{display:flex;flex-wrap:wrap;gap:6px}
.node{display:inline-block;padding:4px 10px;border-radius:7px;font-size:13.5px;border:1px solid transparent}
.node.ready{background:var(--accent-soft);color:var(--accent-ink);font-weight:500}
.node.ready:hover{border-color:var(--accent)}
.node.planned{color:var(--muted);border:1px dashed var(--line)}
.legend{font-size:13px;color:var(--muted);display:flex;gap:16px;margin-top:10px;flex-wrap:wrap;align-items:center}

/* stage + module */
.stage{margin-top:38px}
.stage-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;border-top:2px solid var(--ink);padding-top:12px}
.stage-h h3{font-size:23px;margin:0;font-weight:600}
.stage-h .wk{font-family:var(--mono);font-size:12px;color:var(--muted)}
.stage-h p{width:100%;margin:2px 0 0;color:var(--muted);font-size:15px;max-width:80ch}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:820px){.tri{grid-template-columns:1fr}}
.tri div{padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:14.5px}
.tri b,.mwhy b,.terms b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);font-weight:500;display:block;margin-bottom:2px}
.mwhy{margin-top:16px;padding:10px 16px;border-left:3px solid var(--pin);background:var(--pin-soft);border-radius:0 8px 8px 0;font-size:15px;max-width:none}
.mwhy b{color:var(--pin)}
.mplain{border-left-color:var(--accent);background:var(--accent-soft)}
.mplain b{color:var(--accent-ink)}
.asof{margin-top:10px;font-size:13px;color:var(--muted);font-family:var(--mono);letter-spacing:.01em}
.tblwrap{overflow-x:auto;margin:18px 0 6px}
table.tbl{border-collapse:collapse;font-size:13.5px;width:100%;min-width:560px}
table.tbl th,table.tbl td{text-align:left;padding:7px 12px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
table.tbl td code{font-size:12.5px}
.tblwrap .cap{font-size:13px;color:var(--muted);margin:8px 0 0;max-width:86ch}
.mwhy p{margin:0;max-width:86ch}
.terms{margin-top:12px;font-size:14px}
.terms a{display:inline-block;margin:3px 6px 0 0;padding:2px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink);font-size:13px}
.terms a:hover{border-color:var(--accent)}
.gt:target{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.gt .more{display:block}
.gl-search{width:100%;max-width:420px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:15px;margin-bottom:14px}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:8px}
.gt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14.5px}
.gt b{font-family:var(--display);font-weight:600;font-size:15px}
.gt .alt{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:8px}
.gt p{margin:3px 0 0;color:var(--ink)}
.gt a,.gt .to{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:inline-block;margin-top:4px}
.module{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:16px;box-shadow:var(--shadow)}
.module>summary{list-style:none;cursor:pointer;padding:18px 22px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 14px;align-items:baseline}
.module>summary::-webkit-details-marker{display:none}
.module>summary .n{font-family:var(--mono);font-size:13px;color:var(--accent-ink)}
.module>summary h4{font-size:20px;margin:0;font-weight:600}
.module>summary .meta{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.module>summary .sm{grid-column:2/4;color:var(--muted);font-size:14.5px;margin:0}
.module>summary .chev{display:inline-block;transition:transform .2s;margin-left:8px}
.module[open]>summary .chev{transform:rotate(90deg)}
.module[open]>summary{border-bottom:1px solid var(--line-soft)}
.mbody{padding:6px 22px 24px}
@media (max-width:600px){.module>summary{padding:14px 16px}.mbody{padding:4px 16px 18px}}
.planned-card{background:transparent;border:1px dashed var(--line);border-radius:12px;margin-top:12px;padding:12px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;align-items:baseline}
.planned-card .n{font-family:var(--mono);font-size:13px;color:var(--muted)}
.planned-card h4{font-size:16.5px;margin:0;font-weight:600}
.planned-card ul{grid-column:2;margin:2px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.blk{margin-top:26px}
.blk>h5{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:500;display:flex;gap:10px;align-items:center}
.blk>h5::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.goals{background:var(--accent-soft);border-radius:8px;padding:10px 16px;font-size:14.5px;margin-top:16px}
.goals b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);font-weight:500}
.goals ul{margin:4px 0 0;padding-left:18px}
.prose p{margin:0 0 12px;max-width:76ch}
figure{margin:18px 0 6px}
figure .frame{background:var(--bg);border:1px solid var(--line-soft);border-radius:10px;padding:10px;overflow-x:auto}
figure svg{display:block;width:100%;min-width:560px;height:auto;font-family:var(--body)}
figcaption{font-size:13.5px;color:var(--muted);margin-top:8px;max-width:76ch}
svg .f-ink{fill:var(--ink)} svg .f-muted{fill:var(--muted)} svg .f-accent{fill:var(--accent)} svg .f-pin{fill:var(--pin)} svg .f-surface{fill:var(--surface)}
svg .f-soft{fill:var(--accent-soft)} svg .f-on{fill:var(--bg)}
svg .f-muted2{fill:var(--line)} svg .f-accent2{fill:var(--accent-2)}
svg .s-line{stroke:var(--line)} svg .s-muted{stroke:var(--muted)} svg .s-accent{stroke:var(--accent)} svg .s-pin{stroke:var(--pin)} svg .f-pinsoft{fill:var(--pin-soft)}
svg .mono{font-family:var(--mono)}
[data-lang="zh"] [data-l="en"],[data-lang="en"] [data-l="zh"]{display:none}

.deriv{border:1px solid var(--line-soft);border-radius:10px;margin-top:12px;overflow:hidden}
.deriv>summary{cursor:pointer;padding:10px 16px;font-weight:600;font-family:var(--display);font-size:15.5px;background:var(--surface-2)}
.deriv ol{list-style:none;margin:0;padding:4px 16px 10px;counter-reset:st}
.deriv li{counter-increment:st;display:grid;grid-template-columns:28px minmax(0,1fr);gap:0 8px;padding:12px 0;border-top:1px dashed var(--line-soft)}
.deriv li:first-child{border-top:0}
.deriv li::before{content:counter(st);font-family:var(--mono);font-size:12px;color:var(--accent-ink);background:var(--accent-soft);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin-top:4px}
.deriv .tex{overflow-x:auto;overflow-y:hidden;padding:2px 0 6px}
.deriv .note{font-size:14.5px;color:var(--muted);margin:0;max-width:74ch}
.deriv .src{font-size:13px;color:var(--muted);padding:0 16px 12px}
.katex{font-size:1.05em}
math{font-size:1.05em}

.tier{border-top:1px solid var(--line-soft);padding-top:8px;margin-top:8px}
.tier:first-of-type{border-top:0;padding-top:0}
.tier-h{font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;margin-bottom:2px}
.tier-h .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.tier-h span{font-weight:400;color:var(--muted);font-size:12.5px}
.res{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 10px;padding:6px 0;align-items:start}
.res input,.exdone input{margin:5px 0 0;width:16px;height:16px;accent-color:var(--done);cursor:pointer}
.res .t{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.res .t a{font-weight:500}
.res.done .t a{color:var(--muted);text-decoration:line-through}
.tag{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:1.6;white-space:nowrap}
.tag.zh{color:var(--accent-2);border-color:var(--accent-2)}
.tag.pin{color:var(--pin);border-color:var(--pin);background:var(--pin-soft)}
.tag.acc{color:var(--accent-ink);border-color:var(--accent);background:var(--accent-soft)}
.res .w{font-size:13.5px;color:var(--muted);margin:1px 0 0}

.ex{border:1px solid var(--line);border-radius:10px;margin-top:14px;padding:16px 18px}
.ex-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.ex-h h6{font-family:var(--display);font-size:16.5px;margin:0;font-weight:600}
.ex-h .exdone{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.ex-h .exdone input{margin:0}
.ex .prompt{margin:8px 0 10px;font-size:15px;max-width:76ch}
.ex .prompt p{margin:0 0 8px}
pre{background:var(--code-bg);border:1px solid var(--line-soft);border-radius:8px;padding:12px 14px;overflow:auto;font-family:var(--mono);font-size:12.8px;line-height:1.55;margin:0;max-height:520px;tab-size:4}
pre .c{color:var(--muted);font-style:italic} pre .k{color:var(--accent-2)} pre .s{color:var(--pin)} pre .todo{color:var(--pin);font-weight:500;font-style:normal;background:var(--pin-soft);border-radius:3px}
.codewrap{position:relative;margin-top:6px}
.codewrap .lab{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.copy{font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:5px;padding:2px 8px;cursor:pointer}
.copy:hover{color:var(--ink);border-color:var(--ink)}
.fold{margin-top:8px;border:1px solid var(--line-soft);border-radius:8px}
.fold>summary{cursor:pointer;padding:7px 12px;font-size:14px;font-weight:500}
.fold>div{padding:4px 12px 12px;font-size:14.5px}
.fold>div p{margin:0 0 8px}
.fold.hint>summary{color:var(--pin)}
.fold.sol>summary{color:var(--accent-ink)}
.colab{display:inline-flex;align-items:center;gap:8px;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--ink);background:var(--surface);margin-top:4px}
.colab:hover{border-color:var(--accent)}
.runline{font-size:13.5px;color:var(--muted);margin:6px 0 0}

.faq{border-top:1px dashed var(--line-soft);padding:12px 0}
.faq:first-of-type{border-top:0;padding-top:0}
.faq h6{font-family:var(--body);font-size:15.5px;margin:0 0 4px;font-weight:600}
.faq h6::before{content:"Q";font-family:var(--mono);font-size:11px;color:var(--pin);border:1px solid var(--pin);border-radius:4px;padding:0 5px;margin-right:8px;vertical-align:1px}
.faq p{margin:0;font-size:15px;color:var(--ink);max-width:76ch}
.faq .to{font-size:12.5px;font-family:var(--mono);color:var(--muted);margin-top:4px;display:inline-block}

.whygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.why{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14.5px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
a.why:hover{border-color:var(--accent)}
.why.planned{background:transparent;border-style:dashed;color:var(--muted)}
.why .to{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:auto}
h3.sub{font-size:17px;margin:22px 0 10px;font-weight:600}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.controls .lbl{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
select.sel{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:20px 22px;color:var(--muted);max-width:80ch}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:10px}
.qa .qh{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin-bottom:4px}
.qa .qt{font-weight:600;margin:0 0 4px}
.qa .tr{color:var(--muted);font-size:14.5px;margin:0 0 6px}
.qa .srcs{font-size:13px;color:var(--muted)}

.foot{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);max-width:80ch}
@media (prefers-reduced-motion:reduce){.bar i,.chev{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <a class="brand" href="#top"><i></i><span data-i="brand"></span></a>
  <nav class="topnav" aria-label="sections">
    <a href="#how" data-i="nav_how"></a><a href="#map" data-i="nav_map"></a><a href="#path" data-i="nav_path"></a><a href="#why" data-i="nav_why"></a><a href="#glossary" data-i="nav_gl"></a><a href="#interview" data-i="nav_iv"></a><a id="ghLink" href="#">GitHub</a>
  </nav>
  <div class="seg" id="langSeg" role="group" aria-label="language"><button data-lang="zh">中文</button><button data-lang="en">English</button></div>
</div></div>

<div class="wrap" id="top">
  <header class="hero">
    <div>
      <div class="eyebrow" data-i="eyebrow"></div>
      <h1 id="title"></h1>
      <p class="lede" id="lede"></p>

    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.documentElement.dataset.lang = lang;
    document.querySelectorAll('[data-i]').forEach(n => { n.textContent = u(n.dataset.i).replace(/__DATE__/g, D.site.updated); });
    document.querySelectorAll('#langSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
    document.title = t(D.site.name);
    const nm = t(D.site.name), cut = lang === 'zh' ? nm.indexOf('机制') : nm.indexOf('Mechanism');
    const w = lang === 'zh' ? '机制' : 'Mechanism';
    $('#title').innerHTML = esc(nm.slice(0, cut)) + '<span>' + w + '</span>' + esc(nm.slice(cut + w.length));
    $('#lede').textContent = t(D.site.tagline);
    $('#ghLink').href = D.site.repo;
    const nFaq = ready.reduce((a, k) => a + M[k].faq.length, 0);
    $('#sMods').textContent = ready.length + ' / ' + Object.keys(M).length;
    $('#sEx').textContent = allEx.length; $('#sRes').textContent = allRes.length; $('#sWhy').textContent = nFaq;
    $('#sib').innerHTML = D.site.siblings.map(s => '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(t(s.name)) + '<span>' + esc(t(s.note)) + '</span></a>').join('');
    // overview
    $('#ov').innerHTML = D.stages.map((s, i) => '<div class="ov-row"><div class="ln"><small>' + s.num + '</small>' + esc(t(s.name)) + '</div><div class="nodes">' + s.modules.map(k =>
      M[k].status === 'ready' ? '<a class="node ready" href="#m-' + k + '">' + M[k].num + ' ' + esc(t(M[k].title)) + '</a>' : '<span class="node planned">' + M[k].num + ' ' + esc(t(M[k].title)) + '</span>').join('') + '</div></div>').join('');
    // stages
    const openSet = new Set([...document.querySelectorAll('details.module[open]')].map(d => d.dataset.k));
    $('#stages').innerHTML = D.stages.map((s, i) => '<div class="stage" id="' + s.id + '"><div class="stage-h"><span class="wk">' + s.num + '</span><h3>' + esc(t(s.name)) + '</h3><p>' + esc(t(s.note)) + '</p></div>' + '<div class="tri"><div><b>' + u('s_why') + '</b>' + esc(t(s.why)) + '</div><div><b>' + u('s_what') + '</b>' + esc(t(s.what)) + '</div><div><b>' + u('s_meaning') + '</b>' + esc(t(s.meaning)) + '</div></div>' + s.modules.map(k => {
      const m = M[k];
      if (m.status !== 'ready') return '<div class="planned-card"><span class="n">' + m.num + '</span><h4>' + esc(t(m.title)) + ' <span class="tag">' + u('planned') + '</span></h4><ul>' + m.planned_exercises.map(e => '<li>' + esc(t(e)) + '</li>').join('') + '</ul></div>';
      const ne = (m.exercises || []).length;
      return '<details class="module" id="m-' + k + '" data-k="' + k + '"><summary><span class="n">' + m.num + '</span><h4>' + esc(t(m.title)) + '<span class="chev">›</span></h4><span class="meta">' + ne + ' ' + u('p_ex') + ' · ~' + m.minutes + ' ' + u('min') + '</span><p class="sm">' + esc(t(m.summary)) + '</p></summary><div class="mbody"></div></details>';
    }).join('') + '</div>').join('');
    document.querySelectorAll('details.module').forEach(d => {
      d.addEventListener('toggle', () => { if (d.open) fill(d); });
      if (openSet.has(d.dataset.k)) d.open = true;
    });
    // why column
    $('#whyDone').innerHTML = ready.flatMap(k => M[k].faq.map(f => '<a class="why" href="#m-' + k + '" data-open="' + k + '"><span>' + esc(t(f.q)) + '</span><span class="to">' + M[k].num + ' ' + esc(t(M[k].title)) + '</span></a>')).join('');
    $('#whyPlan').innerHTML = D.whys_planned.filter(w => M[w.module].status !== 'ready').map(w => '<div class="why planned"><span>' + esc(t(w.q)) + '</span><span class="to">' + M[w.module].num + ' ' + esc(t(M[w.module].title)) + '</span></div>').join('');
    renderGl(); renderIv(); updateProg(); route();
  }

  function renderGl(){
    const q = ($('#glSearch').value || '').trim().toLowerCase();
    $('#glSearch').placeholder = u('gl_ph');
    const other = lang === 'zh' ? 'en' : 'zh';
    const xs = (D.glossary || []).filter(g => !q || (g.term.zh + ' ' + g.term.en + ' ' + g.def.zh + ' ' + g.def.en).toLowerCase().includes(q));
    $('#glList').innerHTML = xs.map(g => { const m = M[g.module]; const to = m ? m.num + ' ' + esc(t(m.title)) : '';
      return '<div class="gt" id="' + gid(g.term.en) + '"><b>' + esc(g.term[lang]) + '</b>' + (g.term.zh !== g.term.en ? '<span class="alt">' + esc(g.term[other]) + '</span>' : '') + '<p>' + esc(g.def[lang]) + '</p>' + (m ? (m.status === 'ready' ? '<a href="#m-' + g.module + '">→ ' + to + '</a>' : '<span class="to">→ ' + to + ' · ' + u('planned') + '</span>') : '') + (g.link ? '<a class="more" href="' + esc(g.link) + '" target="_blank" rel="noopener">' + u('gl_more') + ' · ' + esc(RT[g.link] || g.link) + '</a>' : '') + '</div>'; }).join('');
  }
  $('#glSearch').addEventListener('input', renderGl);

  // interview bank
  const ivState = {region:'all', company:'', module:'', type:''};
  function renderIv(){
    const ctl = $('#ivCtl'), list = $('#ivList');
    if (!Q.length) { ctl.hidden = true; list.innerHTML = '<div class="empty">' + esc(t(D.interview.note)) + '</div>'; return; }
    ctl.hidden = false;
    const companies = [...new Set(Q.flatMap(q => q.companies || []))].sort();
    const mods = [...new Set(Q.map(q => q.module))].filter(k => M[k]);
    $('#ivCompany').innerHTML = '<option value="">' + u('any_company') + '</option>' + companies.map(c => '<option' + (c === ivState.company ? ' selected' : '') + '>' + esc(c) + '</option>').join('');
    $('#ivModule').innerHTML = '<option value="">' + u('any_module') + '</option>' + mods.map(k => '<option value="' + k + '"' + (k === ivState.module ? ' selected' : '') + '>' + M[k].num + ' ' + esc(t(M[k].title)) + '</option>').join('');
    $('#ivType').innerHTML = '<option value="">' + u('any_type') + '</option>' + ['report','collection','official'].map(k => '<option value="' + k + '"' + (k === ivState.type ? ' selected' : '') + '>' + u('st_' + k) + '</option>').join('');
    ctl.querySelectorAll('[data-region]').forEach(b => b.setAttribute('aria-pressed', b.dataset.region === ivState.region));
    const xs = Q.filter(q => (ivState.region === 'all' || q.region === ivState.region) && (!ivState.company || (q.companies || []).includes(ivState.company)) && (!ivState.module || q.module === ivState.module) && (!ivState.type || q.source_type === ivState.type));
    list.innerHTML = '<p class="tr" style="margin:0 0 14px">' + esc(t(D.interview.note)) + '</p>' + xs.map(q => {
      const o = q.orig_lang || 'en', other = o === 'zh' ? 'en' : 'zh';
      return '<div class="qa"><div class="qh">' + (q.companies || []).map(c => '<span class="tag acc">' + esc(c) + '</span>').join('') + (q.role ? '<span class="tag">' + esc(q.role) + '</span>' : '') + '<span class="tag pin">' + u('st_' + q.source_type) + '</span><span class="tag">' + (q.sources || []).length + ' ' + u('nsrc') + '</span>' + (M[q.module] ? '<a class="tag" href="#m-' + q.module + '">' + M[q.module].num + ' ' + esc(t(M[q.module].title)) + '</a>' : '') + '</div><p class="qt">' + esc(q.q[o]) + '</p><p class="tr">' + u('trans') + ' · ' + esc(q.q[other]) + '</p><details class="fold sol"><summary>' + u('answer') + '</summary><div>' + md(t(q.a)) + '</div></details><div class="srcs">' + u('sources') + ' · ' + (q.sources || []).map(s => '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title) + '</a>').join(' · ') + '</div></div>';
    }).join('') || '<div class="empty">0</div>';
    typeset(list);
  }
  $('#ivCtl').addEventListener('click', e => { const b = e.target.closest('[data-region]'); if (b) { ivState.region = b.dataset.region; renderIv(); } });
  $('#ivCtl').addEventListener('change', e => { ivState.company = $('#ivCompany').value; ivState.module = $('#ivModule').value; ivState.type = $('#ivType').value; renderIv(); });

  function updateProg(){
    const de = allEx.filter(e => prog.ex[e.id]).length, dr = allRes.filter(r => prog.res[r.url]).length;
    $('#pEx').textContent = u('p_ex') + ' ' + de + ' / ' + allEx.length;
    $('#pRes').textContent = u('p_res') + ' ' + dr + ' / ' + allRes.length;
    const tot = allEx.length + allRes.length;
    $('#pBar').style.width = (tot ? Math.round(100 * (de + dr) / tot) : 0) + '%';
  }
  function route(){
    const id = (location.hash || '').slice(1); if (!id) return;
    let el = document.getElementById(id);
    if (!el && id.indexOf('ex-') === 0 && EX[id.slice(3)]) { const d = document.getElementById('m-' + EX[id.slice(3)].module); if (d) { d.open = true; fill(d); el = document.getElementById(id); } }
    if (el && el.matches('details.module')) { el.open = true; fill(el); }
    if (el) el.scrollIntoView();
  }

  document.addEventListener('change', e => {
    const r = e.target.dataset && e.target.dataset.res, x = e.target.dataset && e.target.dataset.ex;
    if (r) { prog.res[r] = e.target.checked ? 1 : 0; e.target.closest('.res').classList.toggle('done', e.target.checked); }
    if (x) prog.ex[x] = e.target.checked ? 1 : 0;
    if (r || x) { store.set(prog); updateProg(); }
  });
  document.addEventListener('click', e => {
    const c = e.target.closest('[data-copy]');
    if (c) {
      const [what, id] = c.dataset.copy.split(':');
      const done = () => { c.textContent = u('copied'); setTimeout(() => { c.textContent = u('copy'); }, 1400); };
      try { navigator.clipboard.writeText(EX[id][what]).then(done, () => {}); } catch(err){}
      return;
    }
    const b = e.target.closest('#langSeg button');
    if (b) { lang = b.dataset.lang; try { localStorage.setItem('lmr:lang', lang); } catch(err){} render(); }
  });
  window.addEventListener('hashchange', route);
  render();
  // KaTeX's stylesheet may arrive after first render (or not at all where it is blocked): re-typeset open modules once the page has loaded.
  window.addEventListener('load', () => { document.querySelectorAll('details.module[open] .mbody').forEach(b => { b.dataset.lang = ''; fill(b.parentElement); }); });
})();
</script>
</body>
</html>
