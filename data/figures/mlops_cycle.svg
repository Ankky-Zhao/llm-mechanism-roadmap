<text x="390" y="26" font-size="12.5" text-anchor="middle" class="f-muted" data-l="zh">发现漂移后回到数据环节，重新训练</text><text x="390" y="26" font-size="12.5" text-anchor="middle" class="f-muted" data-l="en">on drift, back to the data stage and retrain</text>
<text x="390" y="215" font-size="12.5" text-anchor="middle" class="f-muted" data-l="zh">大模型应用中，“实验”的对象常是提示词与检索配置，“监控”增加了追踪</text><text x="390" y="215" font-size="12.5" text-anchor="middle" class="f-muted" data-l="en">in LLM applications the experiments are often about prompts and retrieval settings, and monitoring adds tracing</text>
</svg>
