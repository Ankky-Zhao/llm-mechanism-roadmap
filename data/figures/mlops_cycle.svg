<g><rect x="398" y="70" width="112" height="50" rx="8" class="f-surface s-line" stroke-width="1.5"/><text x="454" y="100" class="f-ink" data-l="zh">模型注册</text><text x="454" y="100" class="f-ink" data-l="en">Registry</text></g>
