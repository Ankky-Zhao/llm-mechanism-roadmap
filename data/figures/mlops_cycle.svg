<g><rect x="654" y="70" width="112" height="50" rx="8" class="f-pinsoft s-pin" stroke-width="1.5"/><text x="710" y="100" class="f-ink" data-l="zh">监控</text><text x="710" y="100" class="f-ink" data-l="en">Monitoring</text></g>
</g>
<g font-size="12" text-anchor="middle" class="f-muted">
<text x="70" y="142" data-l="zh">数据版本</text><text x="70" y="142" data-l="en">data version</text>
<text x="198" y="142" data-l="zh">参数、指标、产物</text><text x="198" y="142" data-l="en">params, metrics,</text><text x="198" y="158" data-l="en">artifacts</text>
<text x="326" y="142" data-l="zh">与当前版本比较</text><text x="326" y="142" data-l="en">compare with the</text><text x="326" y="158" data-l="en">current version</text>
<text x="454" y="142" data-l="zh">版本号、阶段</text><text x="454" y="142" data-l="en">version, stage</text>
<text x="582" y="142" data-l="zh">打包、接口</text><text x="582" y="142" data-l="en">packaging, API</text>
<text x="710" y="142" data-l="zh">漂移、质量、费用</text><text x="710" y="142" data-l="en">drift, quality, cost</text>
